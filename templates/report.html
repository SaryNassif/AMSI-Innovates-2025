<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoCitizens - Report Pollution</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="bg-green-100">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="{{ url_for('home') }}" class="logo-link">🥬 EcoCitizens</a>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('home') }}" class="logo-link">Home</a>
      <a href="{{ url_for('about') }}" class="logo-link">About Us</a>
      <a href="{{ url_for('report') }}" class="logo-link">Report</a>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('profile') }}" class="logo-link">Profile</a>
      {% else %}
      <a href="{{ url_for('login') }}" class="logo-link">Accounts/Status</a>
      {% endif %}  
    </div>
  </nav>

  <!-- Report Content -->
  <div class="container">
    <h2>📢 Report Pollution</h2>
    <p>Submit a pollution report by filling in the details below.</p>
    <form method="POST" action="{{ url_for('process_report') }}" class="report-form" enctype="multipart/form-data">
          <label>Location:</label>
          <input type="text" name="location" placeholder="Enter location" required />
          
          <label>Description:</label>
          <textarea name="description" placeholder="Describe the issue" required></textarea>

          <button type="submit">Submit Report</button>
          {% if gpt_response %}
          <div class="gpt-output">
            <h3>AI Response:</h3>
            <p style="margin-bottom: 16px;">{{ gpt_response }}</p>
            <a href="{{ url_for('profile') }}" class="logo-link">View Reports</a>
          </div>
          {% endif %}
        </form>
  </div>
  </div>
</body>
</html>
