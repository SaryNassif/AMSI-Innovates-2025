<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoCitizens - Report Pollution</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="bg-green-100">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="{{ url_for('home') }}" class="logo-link">🥬 EcoCitizens</a>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('home') }}" class="logo-link">Home</a>
      <a href="{{ url_for('about') }}" class="logo-link">About Us</a>
      <a href="{{ url_for('report') }}" class="logo-link">Report</a>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('profile') }}" class="logo-link">Profile</a>
      {% else %}
      <a href="{{ url_for('login') }}" class="logo-link">Accounts/Status</a>
      {% endif %}  
    </div>
  </nav>

  <!-- Report Content -->
  <div class="container">
    <h2>📢 Report Pollution</h2>
    <p>Submit a pollution report by filling in the details below.</p>
    <form class="report-form">
      <label>Location:</label>
      <input type="text" placeholder="Enter location" />
      <label>Description:</label>
      <textarea placeholder="Describe the issue"></textarea>
      <label>Upload Image:</label>
      <input type="file" />
      <button type="submit">Submit Report</button>
    </form>

    <br>
    <br>
    <br>

    <h2>Report Status</h2>
    <p>Check the status of your submitted pollution reports.</p>
    <div class="status-check">
      <label>Enter Report ID:</label>
      <input type="text" placeholder="Enter your report ID" />
      <button>Check Status</button>
    </div>

  </div>
  <script src="scripts.js"></script>
</body>
</html>
