<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoCitizens - Profile</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    /* Additional inline styling for the profile page */
    .profile-container {
      max-width: 400px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .profile-container h2 {
      color: #065f46;
      margin-bottom: 1rem;
    }
    .profile-details {
      text-align: left;
      margin: 1rem 0;
    }
    .profile-details p {
      font-size: 1.1rem;
      margin: 0.5rem 0;
    }
    .btn-logout {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #065f46;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-logout:hover {
      background-color: #047857;
    }
  </style>
</head>
<body class="bg-green-100">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <a href="{{ url_for('home') }}" class="logo-link">🥬 EcoCitizens</a>
    </div>
    <div class="nav-links">
      <a href="{{ url_for('home') }}" class="logo-link">Home</a>
      <a href="{{ url_for('about') }}" class="logo-link">About Us</a>
      <a href="{{ url_for('report') }}" class="logo-link">Report</a>
      {% if current_user.is_authenticated %}
      <a href="{{ url_for('profile') }}" class="logo-link">Profile</a>
      {% else %}
      <a href="{{ url_for('login') }}" class="logo-link">Accounts/Status</a>
      {% endif %}
    </div>
  </nav>

  <!-- User Profile Content -->
  <div class="container">
    <div class="profile-container">
      <h2>Welcome, {{ current_user.username }}!</h2>
      <div class="profile-details">
        <p><strong>Username:</strong> {{ current_user.username }}</p>
        <p><strong>Password:</strong> **********</p>
      </div>
      <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit" class="btn-logout">Logout</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
